<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MODERN MYTH — Stories Worth Wearing</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #0d0d0b;
            color: #e7e0d4;
            font-family: Georgia, "Times New Roman", serif;
            line-height: 1.7;
        }

        a {
            color: inherit;
        }

        /* NAVIGATION */

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 28px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-family: Arial, sans-serif;
            font-size: 15px;
            letter-spacing: 5px;
        }

        nav a {
            text-decoration: none;
            margin-left: 22px;
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.75;
        }

        nav a:hover {
            opacity: 1;
        }

        /* HERO */

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 120px 8% 80px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            right: -200px;
            top: 20%;
            background: #27251e;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
        }

        .hero-content {
            max-width: 850px;
            position: relative;
            z-index: 2;
        }

        .eyebrow {
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 5px;
            color: #918b80;
            margin-bottom: 28px;
        }

        h1 {
            font-family: Arial, sans-serif;
            font-weight: 300;
            font-size: clamp(60px, 14vw, 170px);
            line-height: 0.82;
            letter-spacing: -7px;
        }

        .tagline {
            margin-top: 38px;
            font-size: clamp(20px, 3vw, 30px);
            font-style: italic;
            color: #b9b1a3;
        }

        .hero-poem {
            max-width: 430px;
            margin-top: 38px;
            color: #817b71;
            font-size: 15px;
        }

        .hero-poem span {
            display: block;
        }

        .enter {
            display: inline-block;
            margin-top: 42px;
            padding: 14px 26px;
            border: 1px solid #625d54;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            transition: 0.3s;
        }

        .enter:hover {
            background: #e7e0d4;
            color: #0d0d0b;
        }

        /* CHAPTERS */

        .chapter {
            min-height: 100vh;
            padding: 120px 8%;
            display: flex;
            align-items: center;
            border-top: 1px solid #282722;
        }

        .chapter-inner {
            max-width: 700px;
        }

        .chapter-number {
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 4px;
            color: #716c63;
            margin-bottom: 20px;
        }

        h2 {
            font-family: Arial, sans-serif;
            font-weight: 300;
            font-size: clamp(45px, 9vw, 100px);
            line-height: 0.9;
            letter-spacing: -4px;
        }

        .chapter-description {
            margin-top: 28px;
            color: #9a9388;
            font-style: italic;
        }

        .poem {
            margin-top: 38px;
            font-size: 17px;
            color: #c0b8aa;
        }

        .poem strong {
            display: block;
            margin-top: 25px;
            color: #e7e0d4;
            font-weight: normal;
        }
